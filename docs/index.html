<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0b16">
<title>Project Deadzone · Playable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>:root {
  --cy: #4ee8ff; --or: #ffb03a; --gr: #6dff5a; --mu: #c85cff; --red: #ff4a4a; --yl: #ffd23a; --te: #4adcff;
  --panel: rgba(10, 12, 20, 0.74); --line: rgba(110, 200, 255, 0.22);
  --font: 'Rajdhani', 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0f0b16; overflow: hidden; color: #e8ecf4; font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; display: block; }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; }
.dim { color: rgba(220, 230, 245, 0.55); }
.small { font-size: 12px; }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font); letter-spacing: 4px; color: var(--cy); font-size: 22px; text-align: center; background: #0f0b16; z-index: 100; }

/* ---------------- buttons ---------------- */
.btn { background: rgba(78, 232, 255, 0.08); border: 1px solid rgba(78, 232, 255, 0.45); color: #dff8ff; font-weight: 700; letter-spacing: 1.5px; font-size: 15px; padding: 9px 16px; border-radius: 4px; transition: background .15s, transform .08s, box-shadow .15s; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.btn:hover { background: rgba(78, 232, 255, 0.2); box-shadow: 0 0 18px rgba(78, 232, 255, 0.25); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(180deg, #ffc24a, #e69a1c); color: #1a1206; border-color: #ffd27a; }
.btn.primary:hover { box-shadow: 0 0 24px rgba(255, 176, 58, 0.5); background: linear-gradient(180deg, #ffd06a, #f0a62a); }
.btn.ghost { background: transparent; border-color: rgba(255, 255, 255, 0.25); color: #cfd6e4; }
.btn.danger { border-color: rgba(255, 74, 74, 0.6); color: #ffb0b0; background: rgba(255, 74, 74, 0.08); }
.btn.big { font-size: 22px; padding: 12px 34px; letter-spacing: 3px; }
.btn.sm { font-size: 13px; padding: 6px 10px; letter-spacing: 1px; }
.btn.wide { width: 100%; }
.btn.disabled { opacity: 0.4; filter: grayscale(0.6); }
.btn em { font-style: normal; opacity: 0.6; font-size: 11px; }
.ri { display: inline-block; width: 12px; height: 12px; margin: 0 3px 0 4px; vertical-align: -1px; }
.ri.credit { background: var(--yl); transform: rotate(45deg) scale(0.8); }
.ri.bio { background: var(--gr); border-radius: 3px; width: 8px; }
.ri.tech { background: var(--te); }
.ri.mut { background: var(--mu); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }

/* ---------------- screens ---------------- */
.screen { position: absolute; inset: 0; z-index: 20; overflow-y: auto; touch-action: pan-y; }
.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(10, 12, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); color: #dfe6f3; font-size: 18px; transition: background .15s, transform .15s; }
.icon-btn:hover { background: rgba(78, 232, 255, 0.18); transform: rotate(20deg); }
.link-btn { background: none; border: none; color: rgba(220, 230, 245, 0.6); font-size: 14px; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 3px; margin-top: 18px; }
.link-btn:hover { color: #fff; }
.pc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.pc.cy { background: var(--cy); box-shadow: 0 0 8px var(--cy); } .pc.gr { background: var(--gr); box-shadow: 0 0 8px var(--gr); } .pc.or { background: var(--or); box-shadow: 0 0 8px var(--or); }
.cy { color: var(--cy); } .or { color: var(--or); } .gr { color: var(--gr); } .red { color: var(--red); } .mu { color: var(--mu); } .cr { color: var(--yl); } .te { color: var(--te); }

/* ---------------- TITLE ---------------- */
.screen.title { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(15, 11, 22, 0.1) 0%, rgba(15, 11, 22, 0.8) 72%); }
.screen.title .gear { position: absolute; top: 18px; right: 18px; }
.title-wrap { text-align: center; max-width: 960px; padding: 24px; display: flex; flex-direction: column; align-items: center; }
.logo { font-family: var(--font); line-height: 0.9; }
.logo .l1 { display: block; font-size: 24px; letter-spacing: 14px; color: var(--cy); font-weight: 600; }
.logo .l2 { display: block; font-size: clamp(54px, 11vw, 112px); font-weight: 700; letter-spacing: 6px; background: linear-gradient(180deg, #ffffff, #a9f4ff 55%, #4ee8ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(78, 232, 255, 0.25); }
.tagline { font-family: var(--font); font-size: 19px; letter-spacing: 2px; color: #ffcf80; margin: 10px 0 30px; }
.screen.title .btn.big { min-width: 240px; font-size: 26px; padding: 14px 40px; }
.pillars { display: flex; gap: 22px; margin-top: 26px; font-family: var(--font); font-size: 16px; letter-spacing: 2px; color: rgba(230, 236, 245, 0.85); text-transform: uppercase; }
.title-foot { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; }

/* ---------------- HQ ---------------- */
.screen.hq { background: linear-gradient(90deg, rgba(9, 7, 15, 0.96) 0%, rgba(9, 7, 15, 0.9) 40%, rgba(9, 7, 15, 0.25) 62%, rgba(9, 7, 15, 0.05) 100%); overflow: hidden; }
.hq2 { position: absolute; inset: 0; display: flex; flex-direction: column; }
.hq-bar { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); background: rgba(9, 7, 15, 0.6); }
.hq-brand { font-family: var(--font); display: flex; align-items: baseline; gap: 8px; }
.hq-brand b { font-size: 26px; letter-spacing: 5px; }
.hq-brand span { font-size: 14px; letter-spacing: 3px; color: var(--cy); }
.hq-pills { flex: 1; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.rpill { display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 4px 12px 4px 8px; font-family: var(--font); }
.rpill b { font-size: 18px; }
.rpill > span:last-child { font-size: 11px; letter-spacing: 1px; color: rgba(230, 236, 245, 0.5); margin-left: 3px; }
.hq-body { flex: 1; display: flex; min-height: 0; }
.hq-panel { width: min(520px, 46vw); display: flex; flex-direction: column; padding: 18px 22px 22px; min-height: 0; }
.hq-tabs { display: flex; gap: 4px; background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 4px; margin-bottom: 14px; }
.hq-tab { flex: 1; position: relative; background: none; border: none; border-radius: 6px; padding: 10px 2px; color: rgba(230, 236, 245, 0.55); font-size: 13.5px; font-weight: 700; letter-spacing: 1px; transition: background .15s, color .15s; }
.hq-tab:hover { color: #fff; }
.hq-tab.on { background: rgba(78, 232, 255, 0.14); color: #fff; box-shadow: inset 0 -2px 0 var(--cy); }
.hq-tab .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--or); box-shadow: 0 0 8px var(--or); animation: blink 1.2s infinite; }
.hq-flash { background: rgba(109, 255, 90, 0.12); border: 1px solid rgba(109, 255, 90, 0.45); padding: 9px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; animation: pop .35s ease-out; }
.hq-content { flex: 1; overflow-y: auto; padding-right: 4px; animation: stepIn .25s ease-out; }
.hq-content h4 { font-family: var(--font); font-size: 13px; letter-spacing: 3px; color: rgba(230, 236, 245, 0.45); margin: 16px 0 8px; font-weight: 700; }
.hq-content h4:first-child { margin-top: 2px; }
.pick-row { display: flex; gap: 10px; }
.pick-card { flex: 1; text-align: left; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 12px; color: #e8ecf4; font-family: var(--body); transition: border-color .15s, background .15s; }
.pick-card:hover { background: rgba(255, 255, 255, 0.07); }
.pick-card b { display: block; font-family: var(--font); font-size: 20px; letter-spacing: 2px; margin-top: 8px; }
.pick-card span { display: block; font-size: 12px; color: rgba(230, 236, 245, 0.65); margin-top: 2px; }
.pick-card.sel { border-color: var(--op); background: color-mix(in srgb, var(--op) 12%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--op) 25%, transparent); }
.pick-card.locked { opacity: 0.6; }
.pick-ic { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 24px; font-weight: 700; background: color-mix(in srgb, var(--op) 22%, #12141c); border: 2px solid var(--op); color: var(--op); }
.wpick { flex: 1; text-align: left; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 10px 12px; color: #e8ecf4; }
.wpick b { display: block; font-size: 16px; letter-spacing: 1px; }
.wpick span { font-family: var(--body); font-size: 12px; color: rgba(230, 236, 245, 0.6); }
.wpick.sel { border-color: var(--or); background: rgba(255, 176, 58, 0.1); }
.wpick.locked { opacity: 0.55; }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.035); margin-bottom: 6px; }
.hrow-t b { display: block; font-family: var(--font); font-size: 16px; letter-spacing: 1px; }
.hrow-t b small { font-size: 12px; color: rgba(230, 236, 245, 0.5); margin-left: 6px; letter-spacing: 1px; }
.hrow-t span { font-size: 12.5px; color: rgba(230, 236, 245, 0.6); }
.hrow.is-done { opacity: 0.6; }
.hrow.is-locked { opacity: 0.55; }
.hrow .buy { flex: none; white-space: nowrap; min-width: 92px; }
.hrow .reward { font-family: var(--font); font-size: 15px; white-space: nowrap; }
em.ok { font-style: normal; color: var(--gr); font-family: var(--font); letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
em.lock { font-style: normal; color: rgba(230, 236, 245, 0.45); font-family: var(--font); letter-spacing: 1px; font-size: 13px; }
.feature { border-radius: 10px; padding: 14px 16px; background: linear-gradient(135deg, rgba(109, 255, 90, 0.12), rgba(109, 255, 90, 0.02)); border: 1px solid rgba(109, 255, 90, 0.35); }
.feature p { margin: 4px 0 0; font-size: 13.5px; color: rgba(230, 236, 245, 0.8); }
.feat-head { display: flex; justify-content: space-between; font-family: var(--font); }
.feat-head b { font-size: 20px; letter-spacing: 3px; }
.feat-head span { font-size: 18px; color: var(--gr); }
.chest-feature { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, rgba(255, 176, 58, 0.14), rgba(255, 176, 58, 0.02)); border-color: rgba(255, 176, 58, 0.4); }
.chest-feature b { font-family: var(--font); font-size: 20px; letter-spacing: 3px; }
.chest-feature p { margin: 2px 0 8px; }
.chest-feature p.ready { color: var(--or); font-family: var(--font); font-size: 18px; letter-spacing: 1px; }
.chest-feature.ready .crate-ic { animation: bob 1s ease-in-out infinite; box-shadow: 0 0 30px rgba(255, 176, 58, 0.7); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-row div { background: rgba(255, 255, 255, 0.04); padding: 8px 10px; border-radius: 8px; }
.stat-row span { display: block; font-size: 11px; color: rgba(230, 236, 245, 0.55); }
.stat-row b { font-family: var(--font); font-size: 18px; color: var(--cy); letter-spacing: 1px; }
.hq-hero { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; text-align: right; padding: 0 40px 40px; pointer-events: none; background: radial-gradient(ellipse 60% 45% at 100% 100%, rgba(9, 7, 15, 0.75), transparent); }
.hq-hero > * { pointer-events: auto; }
.hero-tag { font-family: var(--font); font-size: 13px; letter-spacing: 3px; color: var(--or); background: rgba(10, 8, 16, 0.75); padding: 3px 10px; border-radius: 3px; }
.hero-name { font-family: var(--font); font-size: clamp(40px, 5vw, 64px); font-weight: 700; letter-spacing: 5px; line-height: 1; text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 3px 6px #000; }
.hero-obj { display: flex; gap: 16px; margin: 10px 0 14px; font-size: 14px; color: rgba(235, 240, 250, 0.9); text-shadow: 0 2px 4px #000; flex-wrap: wrap; justify-content: flex-end; }
.hero-loadout { display: flex; gap: 8px; margin-bottom: 14px; }
.hero-loadout span { font-family: var(--font); font-size: 14px; letter-spacing: 2px; padding: 4px 12px; border-radius: 20px; background: rgba(10, 12, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); }
.hero-loadout span:first-child { border-color: var(--op); color: var(--op); }
.btn.deploy { font-size: 30px; padding: 16px 64px; letter-spacing: 6px; box-shadow: 0 0 30px rgba(255, 176, 58, 0.35); }
.mini-bar { height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--gr); }
.big-bar { height: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 6px; margin: 8px 0; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); }
.big-bar i { display: block; height: 100%; background: linear-gradient(90deg, #3bd16a, var(--gr)); box-shadow: 0 0 12px rgba(109, 255, 90, 0.6); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.rs-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.rs-head b { font-family: var(--font); letter-spacing: 1px; font-size: 16px; }
.rs-head span { font-family: var(--font); color: var(--gr); font-size: 15px; }
.rs-note { font-size: 13px; color: rgba(230, 236, 245, 0.8); }
.crate-ic { width: 54px; height: 44px; background: linear-gradient(180deg, #6a707e, #3a3e48); border: 2px solid var(--or); border-radius: 4px; position: relative; box-shadow: 0 0 20px rgba(255, 176, 58, 0.25); flex: none; }
.crate-ic::after { content: ''; position: absolute; left: 0; right: 0; top: 40%; height: 5px; background: var(--or); }
.skins { display: flex; flex-wrap: wrap; gap: 8px; }
.skin { display: flex; align-items: center; gap: 6px; font-family: var(--font); font-size: 13px; padding: 7px 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.03); color: #dfe6f3; border-radius: 20px; }
.skin i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.skin.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.skin.locked { opacity: 0.45; }

/* ---------------- SETTINGS ---------------- */
.screen.settings { z-index: 40; background: rgba(6, 8, 14, 0.75); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.set-box { width: min(480px, 94vw); padding: 18px 20px 20px; max-height: 92vh; overflow-y: auto; animation: pop .25s ease-out; }
.set-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.set-head h2 { font-family: var(--font); letter-spacing: 5px; margin: 0; font-size: 26px; }
.set-group { border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 0; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; font-size: 15px; }
.set-row small { display: block; font-size: 12px; color: rgba(230, 236, 245, 0.5); }
.set-group summary { cursor: pointer; padding: 8px 0; font-size: 15px; }
.set-group summary small { font-size: 12px; color: rgba(230, 236, 245, 0.5); margin-left: 6px; }
.set-group.danger .set-row > span { color: #ffb0b0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-width: 96px; justify-content: flex-start; padding: 4px 12px 4px 4px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); color: rgba(230, 236, 245, 0.6); font-weight: 700; letter-spacing: 1px; font-size: 13px; }
.toggle i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transition: background .15s; }
.toggle.on { border-color: var(--cy); color: #fff; background: rgba(78, 232, 255, 0.14); }
.toggle.on i { background: var(--cy); box-shadow: 0 0 10px var(--cy); }
.reset-warn { font-size: 14px; line-height: 1.5; color: rgba(255, 220, 220, 0.85); }
.reset-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.btn.danger { border-color: rgba(255, 74, 74, 0.7); color: #fff; background: rgba(255, 74, 74, 0.25); }
.btn:disabled { opacity: 0.4; pointer-events: none; }

/* ---------------- RESULTS (one beat at a time) ---------------- */
.screen.results { overflow: hidden; background: radial-gradient(ellipse at 50% 30%, rgba(20, 16, 32, 0.94), rgba(7, 5, 12, 0.98)); }
.rs2 { height: 100%; display: flex; flex-direction: column; max-width: 1040px; margin: 0 auto; padding: 18px 24px 22px; }
.rs-top { display: flex; align-items: center; justify-content: center; position: relative; height: 28px; }
.rs-top .link-btn { position: absolute; right: 0; margin: 0; }
.rs-dots { display: flex; gap: 8px; }
.rs-dots i { width: 34px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); transition: background .3s; }
.rs-dots i.done { background: rgba(78, 232, 255, 0.5); } .rs-dots i.on { background: var(--cy); box-shadow: 0 0 8px var(--cy); }
.rs-stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; padding: 14px 0; -webkit-mask: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent); mask: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent); }
.beat { width: 100%; margin: auto 0; animation: beatIn .45s ease-out; }
.rs-foot { flex: none; display: flex; gap: 12px; justify-content: center; align-items: center; min-height: 64px; }
.rs-foot .btn { white-space: nowrap; }
.rs-foot .btn.big { min-width: 260px; }
.hint-key { font-family: var(--font); font-size: 11px; letter-spacing: 1px; color: rgba(230, 236, 245, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 3px; padding: 1px 6px; }
body.touch .hint-key { display: none; }
.kicker { display: block; font-family: var(--font); font-size: 13px; letter-spacing: 4px; color: var(--or); }
.beat-head { text-align: center; margin-bottom: 18px; }
.beat-head h1 { font-family: var(--font); font-size: clamp(38px, 6vw, 64px); letter-spacing: 6px; margin: 2px 0; line-height: 1; }
.beat-head.ok h1 { color: var(--gr); text-shadow: 0 0 30px rgba(109, 255, 90, 0.35); }
.beat-head.bad h1 { color: var(--red); text-shadow: 0 0 30px rgba(255, 74, 74, 0.35); }
.beat-head p { margin: 4px 0 0; color: rgba(230, 236, 245, 0.7); font-size: 15px; }
.beat-title { text-align: center; margin-bottom: 20px; }
.beat-title h2 { font-family: var(--font); font-size: clamp(30px, 4.6vw, 46px); letter-spacing: 5px; margin: 2px 0 0; line-height: 1.05; }
.beat-title .sub { margin: 6px 0 0; color: rgba(230, 236, 245, 0.7); font-size: 14px; }
/* summary */
.sum-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: center; }
.sum-map { position: relative; }
.omap { width: 100%; max-height: 52vh; display: block; }
.map-legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; font-size: 12px; color: rgba(230, 236, 245, 0.65); margin-top: 4px; }
.lg { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.lg.route { width: 16px; height: 0; border-top: 2px dashed rgba(255, 255, 255, 0.6); vertical-align: 3px; }
.lg.dot.g { border-radius: 50%; background: var(--gr); } .lg.ring { border-radius: 50%; border: 1.5px solid var(--gr); }
.lg.dia { transform: rotate(45deg) scale(0.8); background: #5affc8; }
.sum-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 12px 14px; opacity: 0; animation: stepIn .4s ease-out forwards; }
.tile:nth-child(1) { animation-delay: .15s; } .tile:nth-child(2) { animation-delay: .25s; } .tile:nth-child(3) { animation-delay: .35s; } .tile:nth-child(4) { animation-delay: .45s; } .tile:nth-child(5) { animation-delay: .55s; } .tile:nth-child(6) { animation-delay: .65s; }
.tile b { display: block; font-family: var(--font); font-size: 30px; line-height: 1; }
.tile span { font-size: 12.5px; color: rgba(230, 236, 245, 0.6); }
.tile.big { grid-column: span 2; display: flex; align-items: baseline; gap: 12px; }
.tile.big b { font-size: 44px; }
.tile.green { border-color: rgba(109, 255, 90, 0.4); background: rgba(109, 255, 90, 0.07); }

/* lab */
.beat-lab { max-width: 620px; margin-left: auto; margin-right: auto; }
.lab-hero { display: flex; align-items: center; justify-content: center; gap: 16px; }
.lab-ico { width: 64px; height: 64px; filter: drop-shadow(0 0 14px rgba(109, 255, 90, 0.7)); animation: bob 1.6s ease-in-out infinite; }
.lab-num b { display: block; font-family: var(--font); font-size: 72px; line-height: 0.9; color: var(--gr); }
.lab-num span { font-size: 15px; color: rgba(230, 236, 245, 0.75); }
.earn { display: flex; justify-content: center; gap: 10px; margin: 16px 0 18px; }
.earn span { font-family: var(--font); font-size: 18px; padding: 4px 14px; border-radius: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
.lab-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(109, 255, 90, 0.3); border-radius: 12px; padding: 14px 18px; }
.lab-card p { margin: 4px 0 0; font-size: 14px; color: rgba(230, 236, 245, 0.8); }
.lab-card.win { border-color: var(--gr); box-shadow: 0 0 30px rgba(109, 255, 90, 0.25); animation: sBank 1s ease-out 1.5s; }
.lab-card.win .rs-head b { color: var(--gr); }
/* specimens */
.spec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.spec { position: relative; text-align: center; padding: 12px 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.08); opacity: 0; animation: stepIn .35s ease-out forwards; animation-delay: calc(var(--i, 0) * 0.05s); }
.spec-ico { width: 44px; height: 44px; margin: 0 auto 6px; }
.spec b { display: block; font-family: var(--font); font-size: 15px; letter-spacing: 1px; }
.spec span { display: block; font-size: 11.5px; color: rgba(230, 236, 245, 0.55); margin-top: 2px; line-height: 1.3; }
.spec.known { border-color: color-mix(in srgb, var(--c) 35%, transparent); }
.spec.known b { color: var(--c); }
.spec.unknown { opacity: 0.6; }
.spec.new { background: color-mix(in srgb, var(--c) 14%, transparent); border-color: var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 40%, transparent); animation: specNew .6s ease-out forwards; animation-delay: calc(var(--i, 0) * 0.05s + 0.3s); }
.spec.new span { color: rgba(240, 244, 250, 0.85); }
.badge { position: absolute; top: 6px; right: 6px; font-style: normal; font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 1px 6px; border-radius: 3px; background: var(--c); color: #0a0a0a; }
.badge.plus { background: rgba(255, 255, 255, 0.12); color: #fff; }
.spec-grid.compact .spec { opacity: 1; animation: none; text-align: left; display: grid; grid-template-columns: 38px 1fr; column-gap: 10px; align-items: center; padding: 8px 10px; }
.spec-grid.compact { grid-template-columns: 1fr 1fr; }
.spec-grid.compact .spec-ico { width: 34px; height: 34px; margin: 0; grid-row: span 2; }
.ms-wrap { margin-top: 18px; }
.ms-track { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); margin: 0 10px 22px; }
.ms-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #2fd1a0, #8affe0); box-shadow: 0 0 10px #5affc8; }
.ms { position: absolute; top: 50%; transform: translate(-50%, -50%); }
.ms i { display: block; width: 16px; height: 16px; border-radius: 50%; background: #1a1d28; border: 2px solid rgba(255, 255, 255, 0.3); }
.ms.done i { background: #5affc8; border-color: #c8fff0; box-shadow: 0 0 10px #5affc8; }
.ms span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-family: var(--font); font-size: 12px; color: rgba(230, 236, 245, 0.6); }
.ms-next, .ms-unlock { text-align: center; font-size: 14px; color: rgba(230, 236, 245, 0.8); }
.ms-unlock { color: #5affc8; font-size: 16px; animation: pop .5s ease-out; }
.ms-next b, .ms-unlock b { color: #fff; }
/* rewards */
.rw-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 900px; margin: 0 auto; }
.rw-card { text-align: center; padding: 18px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); opacity: 0; animation: stepIn .4s ease-out forwards; }
.rw-card:nth-child(2) { animation-delay: .12s; } .rw-card:nth-child(3) { animation-delay: .24s; }
.rw-card .crate-ic { margin: 0 auto 10px; }
.rw-card b { display: block; font-family: var(--font); font-size: 19px; letter-spacing: 2px; }
.rw-card p { margin: 4px 0 0; font-size: 13.5px; color: rgba(230, 236, 245, 0.75); }
.rw-card strong { color: #fff; }
.rw-card.hot { border-color: var(--or); box-shadow: 0 0 24px rgba(255, 176, 58, 0.22); }
.rw-card.done, .rw-card.dim-card { opacity: 0.65; }
.rw-ico { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid var(--yl); color: var(--yl); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.streak-pips { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.streak-pips i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); display: flex; align-items: center; justify-content: center; font-family: var(--font); font-style: normal; font-weight: 700; font-size: 14px; color: rgba(230, 236, 245, 0.6); }
.streak-pips i.on { background: var(--or); border-color: var(--or); color: #1a1206; }
.streak-pips i.now { border-color: var(--or); color: var(--or); animation: pulseRed 1s infinite; box-shadow: 0 0 12px rgba(255, 176, 58, 0.5); }
/* next */
.beat-next { max-width: 620px; margin-left: auto; margin-right: auto; }
.next-list { display: flex; flex-direction: column; gap: 8px; }
.next-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border-left: 3px solid var(--c); opacity: 0; animation: stepIn .35s ease-out forwards; animation-delay: calc(var(--i) * 0.08s); }
.next-item i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
.next-item b { display: block; font-family: var(--font); font-size: 18px; letter-spacing: 1px; }
.next-item span { font-size: 13px; color: rgba(230, 236, 245, 0.7); }
.act-card { width: 100%; margin-top: 14px; display: grid; grid-template-columns: 1fr auto; text-align: left; padding: 12px 16px; border-radius: 10px; background: rgba(255, 176, 58, 0.1); border: 1px dashed rgba(255, 176, 58, 0.6); color: #fff; cursor: pointer; }
.act-card span { grid-column: 1 / -1; font-family: var(--font); font-size: 11px; letter-spacing: 3px; color: var(--or); }
.act-card b { font-family: var(--font); font-size: 17px; letter-spacing: 1px; }
.act-card em { font-style: normal; font-family: var(--font); font-size: 16px; }
.act-card:hover { background: rgba(255, 176, 58, 0.18); }
.act-card.done { border-style: solid; border-color: var(--gr); background: rgba(109, 255, 90, 0.08); }
.act-card.done span { color: var(--gr); }
@keyframes beatIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes specNew { 0% { opacity: 0; transform: scale(0.7) rotate(-4deg); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
/* codex tab + streak in HQ */
.codex-head { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.codex-head div { background: rgba(90, 255, 200, 0.06); border: 1px solid rgba(90, 255, 200, 0.25); border-radius: 8px; padding: 8px 12px; }
.codex-head b { display: block; font-family: var(--font); font-size: 24px; color: #5affc8; }
.codex-head span { font-size: 12px; color: rgba(230, 236, 245, 0.6); }
.hq-content .ms-wrap { margin-top: 14px; }
.codex-map { max-width: 320px; margin: 0 auto; }
.streak-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255, 176, 58, 0.06); border: 1px solid rgba(255, 176, 58, 0.3); margin-bottom: 10px; }
.streak-card .streak-pips { margin: 0; }
.streak-t { flex: 1; }
.streak-t b { display: block; font-family: var(--font); font-size: 17px; letter-spacing: 1px; }
.streak-t span { font-size: 12.5px; color: rgba(230, 236, 245, 0.7); }
@media (max-width: 760px) {
  .rs2 { padding: 12px 14px 16px; }
  .sum-grid { grid-template-columns: 1fr; gap: 12px; }
  .omap { max-height: 34vh; }
  .spec-grid { grid-template-columns: 1fr 1fr; }
  .spec-grid.compact { grid-template-columns: 1fr; }
  .rw-row { grid-template-columns: 1fr; }
  .rs-foot .btn.big { min-width: 0; flex: 1; font-size: 19px; padding: 12px 8px; letter-spacing: 2px; }
  .rs-foot .btn:not(.big) { padding: 13px 12px; font-size: 14px; letter-spacing: 1px; }
  .ms-unlock { font-size: 14px; }
  .lab-num b { font-size: 56px; }
}
@media (max-height: 520px) {
  .sum-grid { grid-template-columns: 1fr 1fr; }
  .omap { max-height: 58vh; }
  .tile { padding: 7px 10px; } .tile b { font-size: 22px; } .tile.big b { font-size: 30px; }
  .beat-head h1 { font-size: 34px; } .beat-title h2 { font-size: 28px; } .beat-title { margin-bottom: 10px; }
  .spec-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; } .spec { padding: 6px; } .spec span { display: none; }
  .rw-row { grid-template-columns: repeat(3, 1fr); } .rw-card { padding: 10px; }
  .rs-foot { min-height: 50px; }
  .rs-stage { padding: 6px 0; }
  .beat-head { margin-bottom: 8px; } .map-legend { margin-top: 0; }
  .next-item { padding: 7px 14px; } .next-item b { font-size: 15px; } .next-list { gap: 5px; }
  .ms-wrap { margin-top: 10px; } .ms-track { margin-bottom: 18px; } .rs-top { height: 20px; }
  .rs2 { padding-top: 8px; padding-bottom: 8px; }
  .beat .kicker { display: none; } .beat-head h1 { font-size: 30px; } .beat-head p { font-size: 13px; }
  .beat-title h2 { font-size: 24px; } .beat-title .sub { font-size: 12px; margin-top: 2px; }
  .omap { max-height: calc(100vh - 200px); }
  .sum-tiles { gap: 6px; } .tile { padding: 5px 10px; } .tile b { font-size: 19px; } .tile.big b { font-size: 26px; } .tile span { font-size: 11px; }
  .spec { padding: 4px 6px; } .spec-ico { width: 30px; height: 30px; margin-bottom: 2px; } .spec b { font-size: 13px; }
  .next-item span { font-size: 11.5px; }
  .beat-next { max-width: 820px; } .next-list { display: grid; grid-template-columns: 1fr 1fr; } .act-card { margin-top: 8px; padding: 7px 14px; }
  .rw-card .crate-ic, .rw-ico { margin-bottom: 4px; }
}

/* ---------------- UPGRADE ---------------- */
.screen.upgrade { background: rgba(6, 8, 14, 0.72); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.up-wrap { text-align: center; padding: 20px; animation: pop .3s ease-out; }
.up-title { font-family: var(--font); font-size: 34px; letter-spacing: 5px; font-weight: 700; margin-bottom: 18px; }
.up-title em { display: block; font-style: normal; font-size: 18px; letter-spacing: 6px; color: #5affc8; }
.up-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.up-card { display: flex; flex-direction: column; justify-content: flex-start; opacity: 0; animation: cardIn .35s ease-out forwards; animation-delay: calc(var(--i) * 0.08s); width: 230px; min-height: 230px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 16%, #10131c), #0d1018); border: 1px solid var(--c); color: #e8ecf4; border-radius: 8px; padding: 18px 16px; text-align: left; position: relative; transition: transform .12s, box-shadow .12s; font-family: var(--body); }
.up-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px color-mix(in srgb, var(--c) 35%, transparent); }
.up-cat { font-family: var(--font); letter-spacing: 3px; font-size: 13px; color: var(--c); font-weight: 700; }
.up-name { font-family: var(--font); font-size: 26px; font-weight: 700; letter-spacing: 1px; margin: 10px 0 8px; line-height: 1.05; }
.up-desc { font-size: 14px; line-height: 1.4; color: rgba(230, 236, 245, 0.85); }
.up-key { position: absolute; bottom: 10px; right: 12px; font-family: var(--font); font-size: 14px; color: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 3px; padding: 0 6px; }
body.touch .up-key { display: none; }

/* ---------------- PAUSE / MODAL ---------------- */
.screen.pause, .screen.modal { background: rgba(6, 8, 14, 0.7); display: flex; align-items: center; justify-content: center; }
.pause-box { width: 340px; padding: 24px; display: flex; flex-direction: column; gap: 10px; text-align: center; animation: pop .2s ease-out; }
.pause-box small { opacity: .6; font-size: 11px; }

.modal-box { padding: 30px; }
.ad-fake { width: 320px; height: 220px; background: repeating-linear-gradient(45deg, #1b1f2c, #1b1f2c 12px, #20253a 12px, #20253a 24px); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); letter-spacing: 3px; font-size: 22px; text-align: center; }

/* ---------------- HUD ---------------- */
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: var(--font); }
body.in-mission:not(.touch) #gl { cursor: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(4px); }
.vignette { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; }
#vig-out { background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 70, 30, 0.22) 75%, rgba(255, 40, 20, 0.5) 100%); }
#vig-hurt { background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 0, 0.45) 100%); }
#vig-hurt.flash { animation: hurt .35s ease-out; }
#vig-amp { background: radial-gradient(ellipse at center, transparent 62%, rgba(255, 60, 60, 0.18) 100%); }
/* top-left: operative */
.hud-tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 10px; padding: 8px 12px 8px 8px; width: 300px; }
.portrait { width: 62px; height: 62px; border-radius: 6px; border: 2px solid var(--op, var(--or)); background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--op, #e8b23a) 45%, #222) 0%, #15171f 70%); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: var(--op, var(--or)); flex: none; }
.tl-main { flex: 1; min-width: 0; }
.op-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; font-weight: 700; letter-spacing: 2px; line-height: 1; }
.op-row .lvl { font-size: 14px; color: #5affc8; letter-spacing: 1px; }
.bar { position: relative; height: 18px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 3px; overflow: hidden; margin-top: 5px; }

.loadout { display: flex; gap: 5px; margin-top: 6px; }
.slot { position: relative; height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 7px; background: rgba(255, 255, 255, 0.07); border-radius: 4px; overflow: hidden; font-size: 13px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.slot em { font-style: normal; font-size: 9px; letter-spacing: 0.5px; color: rgba(230, 236, 245, 0.45); position: absolute; left: 0; right: 0; bottom: 1px; text-align: center; }
body.touch .slot em { display: none; }
.slot.weapon { --wc: #ffd46b; color: var(--wc); border: 1px solid color-mix(in srgb, var(--wc) 50%, transparent); min-width: 104px; }

.buffs { display: flex; gap: 5px; }
.buff { margin-top: 5px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 3px; }

.buff.amp { background: rgba(255, 60, 60, 0.3); color: #ffb0b0; border: 1px solid #ff5a5a; animation: blink 0.8s infinite; }
.outside { margin-top: 6px; font-size: 14px; letter-spacing: 1px; color: #ffd1a8; background: rgba(255, 90, 30, 0.22); border: 1px solid rgba(255, 120, 60, 0.5); padding: 3px 8px; border-radius: 3px; }
.outside b { color: #fff; }
.outside.severe { background: rgba(255, 40, 30, 0.4); border-color: var(--red); animation: blink .7s infinite; }
/* top-centre: objective */

.objective { display: flex; align-items: center; gap: 12px; padding: 8px 16px 10px 10px; min-width: 330px; border-color: rgba(255, 176, 58, 0.45); }
.obj-ico { width: 38px; height: 38px; border-radius: 6px; background: rgba(255, 176, 58, 0.16); color: var(--or); display: flex; align-items: center; justify-content: center; flex: none; }
.obj-ico svg { width: 24px; height: 24px; }

/* top-right: beacon */
.hud-tr { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.beacon-panel { padding: 8px 12px; width: 220px; }
.bp-head { display: flex; align-items: center; gap: 8px; }

.res-row { display: flex; gap: 8px; font-size: 16px; font-weight: 700; align-items: center; }
.res { background: rgba(10, 12, 20, 0.6); padding: 1px 8px; border-radius: 3px; }

.lens-btn { pointer-events: auto; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 3px 9px; background: rgba(10, 12, 20, 0.7); color: rgba(230, 236, 245, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 3px; }
.lens-btn.on { color: #08131a; background: var(--cy); border-color: var(--cy); }
/* one-line callout + alerts + announcements */
#alert { position: absolute; left: 50%; top: 142px; transform: translateX(-50%); font-size: 19px; font-weight: 700; letter-spacing: 2px; padding: 5px 16px; background: rgba(120, 10, 20, 0.8); border: 1px solid var(--red); border-radius: 4px; color: #fff; animation: pulseRed 0.7s infinite; white-space: nowrap; }
#callout { position: absolute; left: 50%; top: 186px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; border-radius: 20px; background: rgba(10, 12, 20, 0.82); border: 1px solid rgba(78, 232, 255, 0.45); font-family: var(--body); font-size: 14px; font-weight: 600; white-space: nowrap; opacity: 0; }
#callout.show { animation: callIn 2.8s ease-out forwards; }

#announce.pop { animation: annIn 1.3s ease-out forwards; }
.ann-orange { color: #ffb43a; } .ann-teal { color: #5affc8; } .ann-cyan { color: #6ef0ff; } .ann-green { color: #8aff7a; }
#banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; }
#banner .b1 { font-size: clamp(40px, 7vw, 72px); font-weight: 700; letter-spacing: 8px; color: #fff; text-shadow: 0 0 24px rgba(255, 176, 58, 0.6), 0 2px 4px #000; line-height: 1; }
#banner .b2 { font-size: 20px; letter-spacing: 6px; color: var(--or); text-shadow: 0 2px 4px #000; margin-top: 6px; }

/* combo */
#combo { position: absolute; right: 22px; top: 42%; text-align: right; }

/* loot reveal */

#loot.pop { animation: lootIn 2.4s ease-out forwards; }

.loot-ico svg { width: 100%; height: 100%; }
#loot.spec { border-color: #5affc8; background: radial-gradient(ellipse at center, rgba(10, 50, 44, 0.94), rgba(8, 14, 16, 0.94)); box-shadow: 0 0 40px rgba(90, 255, 200, 0.35); }
#loot.spec .loot-tag { color: #5affc8; }

#loot.spec .loot-desc { max-width: 280px; margin: 2px auto 0; }
.loot-tag { font-size: 12px; letter-spacing: 5px; color: #ffcf80; }
.loot-name { font-size: 30px; font-weight: 700; letter-spacing: 3px; color: #fff; }
.loot-desc { font-family: var(--body); font-size: 13px; color: rgba(255, 235, 210, 0.85); }
/* tutorial card */
#tcard { position: absolute; left: 50%; bottom: 122px; transform: translateX(-50%); background: rgba(10, 12, 20, 0.9); border: 2px solid var(--cy); border-radius: 10px; padding: 12px 18px 14px; min-width: 380px; text-align: center; pointer-events: none; box-shadow: 0 0 30px rgba(78, 232, 255, 0.25); }

.tdots i.d { background: var(--gr); } .tdots i.c { background: var(--cy); }
.trow { display: flex; align-items: center; gap: 16px; justify-content: center; }
.kcs { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; }
.kc { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 6px; background: linear-gradient(180deg, #2a3040, #1a1e2a); border: 1px solid rgba(255, 255, 255, 0.35); border-bottom-width: 3px; font-family: var(--font); font-weight: 700; font-size: 16px; color: #fff; }

.ttxt span { font-family: var(--body); font-size: 14px; color: rgba(230, 236, 245, 0.8); }
.tcheck { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); color: transparent; display: flex; align-items: center; justify-content: center; }

.tskip { pointer-events: auto; position: absolute; right: 0; top: -30px; background: rgba(10, 12, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 3px; padding: 2px 8px; color: rgba(230, 236, 245, 0.6); font-size: 11px; letter-spacing: 1.5px; }

/* interact prompt */

/* bottom action bar: XP + loadout */
#actionbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: 420px; }
#xpbar { display: flex; align-items: center; gap: 8px; width: 100%; }

.xp-track { flex: 1; height: 8px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(90, 255, 200, 0.35); border-radius: 5px; overflow: hidden; }

body.touch .loadout .slot:not(.weapon) { display: none; }

/* reticle */

#lens { position: absolute; right: 12px; top: 150px; width: 264px; padding: 10px 12px; font-family: var(--body); font-size: 12px; border-color: rgba(200, 92, 255, 0.5); }

/* world labels */

.ft-sample { color: var(--gr); font-size: 19px; }

/* off-screen indicators */

.ind span { font-size: 12px; font-weight: 700; letter-spacing: 1px; background: rgba(10, 12, 20, 0.8); padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.ind .arr { position: absolute; left: 50%; top: 50%; margin-top: -7px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid currentColor; transform-origin: 0 50%; }
.ind.bio { color: var(--gr); } .ind.rare { color: var(--mu); } .ind.beacon { color: var(--cy); } .ind.loot { color: #ffb43a; } .ind.node { color: #5affc8; opacity: 0.75; }
.ind.ext { color: var(--or); } .ind.alert { color: var(--red); } .ind.emp { color: var(--mu); animation: blink .4s infinite; }

/* touch controls */

.tbtn { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(10, 12, 20, 0.55); color: #fff; font-weight: 700; letter-spacing: 1px; font-size: 13px; touch-action: none; white-space: pre-line; line-height: 1; overflow: hidden; }

.tbtn.interact { right: 34px; bottom: 140px; width: 76px; height: 76px; border-color: var(--cy); background: rgba(78, 232, 255, 0.3); font-size: 15px; }
.tbtn.ready { left: 50%; transform: translateX(-50%); bottom: 46px; width: 110px; height: 42px; border-radius: 22px; border-color: var(--or); font-size: 15px; }

body.touch #prompt { bottom: 236px; }
body.touch #tcard { min-width: 0; width: min(420px, 86vw); bottom: 150px; }

@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#toast.pop { animation: toastIn .3s ease-out; }
@keyframes toastIn { from { transform: translate(-50%, 10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes bannerIn { 0% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes stepIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes blink { 50% { opacity: 0.45; } }
@keyframes pulseRed { 50% { box-shadow: 0 0 22px rgba(255, 60, 60, 0.6); } }
@keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes callIn { 0% { opacity: 0; transform: translate(-50%, 8px); } 8% { opacity: 1; transform: translate(-50%, 0); } 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes annIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
@keyframes lootIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 16% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
@keyframes objIn { 0% { transform: scale(1.12); box-shadow: 0 0 30px rgba(255, 176, 58, 0.7); } 100% { transform: none; } }
@keyframes sPulse { 50% { transform: scale(1.12); box-shadow: 0 0 20px rgba(109, 255, 90, 0.6); } }
@keyframes sBank { 0% { transform: scale(1); } 30% { transform: scale(1.2); box-shadow: 0 0 34px rgba(109, 255, 90, 0.9); border-color: var(--gr); } 100% { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes slotPop { 0% { transform: scale(1.3); box-shadow: 0 0 20px var(--wc); } 100% { transform: none; } }
@keyframes xpFlash { 0% { box-shadow: 0 0 30px #5affc8; } 100% { box-shadow: none; } }
@keyframes kenburns { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.14) translate(-2%, -1%); } }

@media (max-width: 1100px) {
  .hq-grid { grid-template-columns: 1fr 1fr; }
  .hq-col:last-child { grid-column: span 2; }
}
@media (max-width: 1100px) { .rpill > span:last-child { display: none; } }

  .hq-bar { padding: 6px 14px; }
  .hq-brand b { font-size: 20px; }
  .icon-btn { width: 34px; height: 34px; }
  .hq-panel { padding: 8px 14px 10px; width: 50vw; }
  .hq-tabs { margin-bottom: 8px; }
  .hq-tab { padding: 7px 2px; font-size: 13px; letter-spacing: 1px; }
  .hq-content h4 { margin: 10px 0 6px; }
  .pick-card { padding: 8px; } .pick-card b { font-size: 16px; margin-top: 4px; } .pick-ic { width: 30px; height: 30px; font-size: 18px; }
  .hrow { padding: 7px 10px; }
  .hq-hero { padding: 0 18px 16px; }
  .hero-name { font-size: 34px; } .hero-obj { font-size: 12px; gap: 10px; margin: 6px 0 8px; } .hero-loadout { margin-bottom: 8px; }
  .btn.deploy { font-size: 22px; padding: 10px 40px; }
}
/* portrait phones / narrow windows: stack */
@media (max-width: 700px) {
  .screen.hq { background: rgba(9, 7, 15, 0.92); overflow-y: auto; }
  .hq2 { position: relative; inset: auto; min-height: 100%; }
  .hq-body { flex-direction: column; }
  .hq-panel { width: 100%; padding: 12px 14px; }
  .hq-content { overflow: visible; }
  .hq-hero { order: -1; align-items: stretch; text-align: left; padding: 14px 14px 4px; }
  .hero-obj, .hero-loadout { justify-content: flex-start; }
  .hero-name { font-size: 38px; }
  .btn.deploy { position: sticky; bottom: 10px; width: 100%; font-size: 24px; padding: 13px; }
  .hq-bar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
  .hq-pills { order: 3; flex: 1 1 100%; justify-content: flex-start; flex-wrap: nowrap; }
  .hq-brand { flex: 1; }
  .hq-tab { font-size: 13px; letter-spacing: 1px; padding: 9px 2px; }
}
@media (max-width: 760px) {
  .res-grid { grid-template-columns: 1fr; }
  .pillars { flex-direction: column; gap: 8px; }
  .dir-row { grid-template-columns: repeat(2, 1fr); }
  .title-wrap { padding: 16px; }
  .logo .l1 { font-size: 18px; letter-spacing: 10px; }
  .tagline { font-size: 16px; margin-bottom: 18px; }
  .wp-list { flex-direction: column; }
}
/* ---- phones, landscape ---- */
@media (max-height: 520px) {
  .hud-tl { transform: scale(0.68); transform-origin: top left; left: 6px; top: 6px; }
  .hud-tr { transform: scale(0.68); transform-origin: top right; right: 6px; top: 6px; }
  .hud-tc { top: 6px; transform: translateX(-50%) scale(0.72); transform-origin: top center; }
  .objective { min-width: 300px; }
  #alert { top: 96px; font-size: 13px; padding: 3px 10px; }
  #callout { top: 124px; font-size: 12px; }
  #banner .b1 { font-size: 38px; } #banner .b2 { font-size: 15px; }
  #announce { font-size: 34px; }
  #prompt, body.touch #prompt { bottom: 120px; font-size: 13px; }
  #lens { display: none; }
  #combo { top: 34%; } #combo b { font-size: 38px; }
  #loot { top: 54%; transform: translate(-50%, -50%) scale(0.8); }
  .tbtn.dash { width: 84px; height: 84px; right: 18px; bottom: 18px; }
  .tbtn.skill { right: 112px; bottom: 14px; width: 58px; height: 58px; }
  .tbtn.grenade { right: 108px; bottom: 82px; width: 58px; height: 58px; }
  .tbtn.interact { right: 24px; bottom: 112px; width: 64px; height: 64px; }
  .tbtn.ready { bottom: 26px; }
  .tbtn.pause { top: 36%; }
  body.touch #tcard { bottom: 30px; transform: translateX(-50%) scale(0.78); transform-origin: bottom center; }
  .up-card { width: 190px; min-height: 0; padding: 12px; }
  .up-name { font-size: 21px; margin: 6px 0; }
  .up-desc { font-size: 13px; }
  .up-title { font-size: 24px; margin-bottom: 10px; }
  .up-title em { font-size: 14px; }
}
/* ---- phones, portrait ---- */
@media (max-width: 600px) and (orientation: portrait) {
  .hud-tl { transform: scale(0.6); transform-origin: top left; left: 6px; top: 6px; }
  .hud-tr { transform: scale(0.6); transform-origin: top right; right: 6px; top: 6px; }
  .hud-tc { top: 118px; transform: translateX(-50%) scale(0.82); transform-origin: top center; }
  .objective { min-width: 0; }
  .obj-title { font-size: 19px; }
  #alert { top: 230px; font-size: 13px; white-space: normal; text-align: center; max-width: 92vw; }
  #callout { top: 262px; font-size: 12px; white-space: normal; max-width: 90vw; }
  #banner .b1 { font-size: 40px; letter-spacing: 4px; }
  #announce { font-size: 32px; letter-spacing: 3px; }
  #lens { display: none; }
  #combo { top: 30%; } #combo b { font-size: 36px; }
  #loot { transform: translate(-50%, -50%) scale(0.85); }
  .tbtn.ready { left: auto; right: 22px; transform: none; bottom: 240px; width: 96px; }
  body.touch #tcard { bottom: auto; top: 252px; transform: translateX(-50%) scale(0.88); transform-origin: top center; }
  .up-cards { flex-direction: column; align-items: center; gap: 10px; }
  .up-card { width: 86vw; min-height: 0; padding: 12px 14px; }
  .up-name { font-size: 22px; margin: 4px 0; }
  #prompt, body.touch #prompt { bottom: 250px; font-size: 13px; }
}
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.95); } to { opacity: 1; transform: none; } }
/* ---------------- STORY ---------------- */
.screen.story { background: #07050c; display: flex; align-items: center; justify-content: center; }
.story-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
.story-art { position: absolute; left: 0; right: 0; top: 0; bottom: clamp(170px, 28vh, 230px); cursor: pointer; overflow: hidden; border-bottom: 1px solid rgba(255, 176, 58, 0.35); }
.story-art svg { width: 100%; height: 100%; display: block; animation: kenburns 9s ease-out forwards; }
.story-cap { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(170px, 28vh, 230px); padding: 14px 6vw 0; background: #07050c; text-align: center; animation: stepIn .5s ease-out; display: flex; flex-direction: column; justify-content: center; }
.story-cap h2 { font-family: var(--font); font-size: clamp(28px, 4.6vw, 52px); letter-spacing: 5px; margin: 6px 0 4px; color: #fff; }
.story-cap p { font-size: clamp(14px, 1.8vw, 18px); color: rgba(235, 238, 248, 0.85); margin: 0 auto 14px; max-width: 640px; }
.story-dots { display: flex; gap: 8px; justify-content: center; }
.story-dots i { width: 34px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.2); }
.story-dots i.on { background: var(--or); }
.story-btns { display: flex; gap: 12px; justify-content: center; }
/* pause: controls */
.controls-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; text-align: left; font-size: 12px; color: rgba(230, 236, 245, 0.75); }
.controls-list .kc { min-width: 0; height: 22px; font-size: 11px; padding: 0 6px; margin-right: 6px; border-bottom-width: 2px; }
body.touch .controls-list { display: none; }
